# Exemplo de Secret — NÃO contém segredos reais. Copie para secret.yaml (git-ignorado)
# e preencha com valores reais antes de aplicar no cluster, ou gere via
# `kubectl create secret generic posvenda-secrets --from-literal=...`.
apiVersion: v1
kind: Secret
metadata:
  name: posvenda-secrets
  namespace: posvenda
type: Opaque
stringData:
  db-password: troque-por-um-valor-real
  internal-token: troque-por-um-valor-real
  operador-senha: troque-por-um-valor-real
