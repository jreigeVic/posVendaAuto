spring.application.name=posVendaAuto

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:posvenda_principal_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

venda-veiculos-service.base-url=${VENDA_VEICULOS_SERVICE_URL:http://localhost:8081}
app.internal-token=${INTERNAL_TOKEN:dev-only-token}

app.operador.usuario=${OPERADOR_USUARIO:operador}
app.operador.senha=${OPERADOR_SENHA:changeit-local-dev}

sincronizacao.job.intervalo-ms=${SINCRONIZACAO_INTERVALO_MS:5000}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
