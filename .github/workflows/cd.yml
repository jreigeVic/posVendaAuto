name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.vars.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir nome da imagem
        id: vars
        run: echo "image=ghcr.io/${{ github.repository_owner }}/posvendaauto:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}
            ghcr.io/${{ github.repository_owner }}/posvendaauto:latest

  deploy-local-kind:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Criar cluster kind (mock local de um cluster gerenciado, ex. EKS)
        uses: helm/kind-action@v1

      - name: Aplicar manifests Kubernetes
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/postgres.yaml
          kubectl create secret generic posvenda-secrets \
            --namespace posvenda \
            --from-literal=db-password=postgres \
            --from-literal=internal-token=ci-token \
            --from-literal=operador-senha=ci-password
          kubectl set image -f k8s/deployment.yaml software-principal=${{ needs.build-and-push-image.outputs.image }} --local -o yaml | kubectl apply -f -
          kubectl apply -f k8s/service.yaml

      - name: Aguardar rollout
        run: kubectl rollout status deployment/software-principal -n posvenda --timeout=180s
